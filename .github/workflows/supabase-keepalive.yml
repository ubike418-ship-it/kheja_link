# Keeps the free Supabase project from pausing, and sends queued alerts.
#
# Supabase pauses a free project after about a week with no API activity. This
# makes real requests against the project every hour, straight from GitHub, so
# it keeps working even if the website is down. Vercel Cron (vercel.json) is a
# second, independent keep-alive once a day.
#
# Setup — GitHub → Settings → Secrets and variables → Actions → New secret:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon / public key (safe; RLS protects the data)
#   CRON_SECRET        optional; the same value as CRON_SECRET on Vercel.
#                      With it, each run also sends pending email / SMS alerts.
#
# GitHub turns scheduled workflows off after 60 days with no commits to the
# repository. If that happens, GitHub emails the owner; re-enable it from the
# Actions tab. The Vercel cron keeps the project alive in the meantime.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            "$SUPABASE_URL/rest/v1/property_types?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/run_daily_maintenance" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

      - name: Send queued notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set; skipping email / SMS dispatch."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 15 --max-time 60 \
            "https://www.khejalink.name.ng/api/cron/daily" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo
