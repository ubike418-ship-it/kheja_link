# Keeps the free Supabase project from pausing.
#
# Supabase pauses a free project after about a week with no API activity. This
# makes real requests against the project every hour, straight from GitHub, so
# it keeps working even if the website is down. Vercel Cron (vercel.json) is a
# second, independent keep-alive once a day.
#
# Setup — GitHub → Settings → Secrets and variables → Actions → New secret:
#   SUPABASE_URL       https://<project-ref>.supabase.co   (the Project URL
#                      from Supabase → Project Settings → API — not the
#                      dashboard link). Just the project ref also works.
#   SUPABASE_ANON_KEY  the anon / public key (safe; RLS protects the data)
#
# GitHub turns scheduled workflows off after 60 days with no commits to the
# repository. If that happens, GitHub emails the owner; re-enable it from the
# Actions tab. The Vercel cron keeps the project alive in the meantime.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # Also run once whenever this file changes, so a fix is checked at once.
  push:
    branches: [main]
    paths: [".github/workflows/supabase-keepalive.yml"]

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Forgive copy-paste slips: spaces, quotes, line breaks, invisible
          # characters picked up from a web page (zero-width or non-breaking
          # spaces), capitals, a trailing slash or path, a missing https://,
          # just the ref, or the dashboard link. Only characters that can be
          # in a URL or a key survive.
          URL=$(printf '%s' "$RAW_URL" | LC_ALL=C tr -cd 'A-Za-z0-9:/._-' | tr 'A-Z' 'a-z')
          KEY=$(printf '%s' "$RAW_KEY" | LC_ALL=C tr -cd 'A-Za-z0-9._-')
          URL=${URL%/}
          # The dashboard link (supabase.com/dashboard/project/<ref>) carries the ref too.
          REF_IN_DASHBOARD=$(printf '%s' "$URL" | sed -nE 's#.*supabase\.com/dashboard/project/([a-z0-9]{20}).*#\1#p')
          if [ -n "$REF_IN_DASHBOARD" ]; then URL="$REF_IN_DASHBOARD"; fi
          if printf '%s' "$URL" | grep -Eq '^[a-z0-9]{20}$'; then URL="https://$URL.supabase.co"; fi
          case "$URL" in http://*|https://*) ;; *) URL="https://$URL" ;; esac
          URL=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#; s#^http://#https://#')

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          if ! printf '%s' "$URL" | grep -Eq '^https://[a-z0-9]{20}\.supabase\.co$'; then
            # Enough to recognise the mistake without printing the value.
            echo "::error::SUPABASE_URL is not a Supabase project URL (after clean-up it is ${#URL} characters and starts '$(printf '%s' "$URL" | cut -c1-12)'). Set it to the Project URL from Supabase → Project Settings → API, e.g. https://abcdefghijklmnopqrst.supabase.co"
            exit 1
          fi
          echo "Pinging ${URL%%.supabase.co}.supabase.co"

          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            "$URL/rest/v1/property_types?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
          echo
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -X POST "$URL/rest/v1/rpc/run_daily_maintenance" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
